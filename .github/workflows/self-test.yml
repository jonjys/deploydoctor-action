name: Self-test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # Runs this repository's own action.yml in free mode against a public Next.js app.
      - uses: ./
        with:
          repository: ${{ github.repository }}
          fail-on: never
