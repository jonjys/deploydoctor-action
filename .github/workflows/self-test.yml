name: Self-test
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: deploydoctor-self-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # maintains one report comment on same-repository PRs
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # Runs this repository's own action.yml in free mode against a public Next.js app.
      - uses: ./
        with:
          repository: ${{ github.repository }}
          fail-on: never
