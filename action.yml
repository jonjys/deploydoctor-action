name: DeployDoctor
description: "Catch Vercel deploy failures in pull requests: imports, env vars, Edge runtime, Prisma. Free for public repos."
author: Nytto Labs
branding:
  icon: activity
  color: green
inputs:
  token:
    description: "Optional. DeployDoctor API token from My scans while a pass is active, for private repositories and unlimited scans. Leave it out on a public repository to scan for free (1 scan a day per repository); the workflow then needs the id-token write permission."
    required: false
    default: ""
  repository:
    description: GitHub repository to scan, as owner/name. Defaults to the repository the workflow runs in.
    required: false
    default: ${{ github.repository }}
  ref:
    description: Branch, tag or commit to scan. Defaults to the pull request head, or the pushed commit.
    required: false
    default: ${{ github.event.pull_request.head.sha || github.sha }}
  github-token:
    description: Only for private repositories. A token with read access to the repository contents, usually the workflow's own github.token. It is forwarded to DeployDoctor for this scan and never stored.
    required: false
    default: ""
  fail-on:
    description: Which findings fail the job. `never` (default) only reports. `red` fails on high-risk findings. `yellow` also fails on items that need review. A scan that cannot finish still passes unless `fail-on-high-risk` is true.
    required: false
    default: never
  fail-on-high-risk:
    description: "When true, fail the job if the report has high-risk (red) findings or if the scan cannot finish. Default false keeps the job green and reports in the pull request comment. Using up the free daily scan still passes."
    required: false
    default: "false"
  checks:
    description: Comma-separated categories to scan. Any of next, vercel, env, supabase, prisma. Leave empty to let the detected stack decide.
    required: false
    default: ""
  comment:
    description: Update one sticky PR conversation comment. Requires pull-requests write on the workflow token. Does not comment on forks, Dependabot or non-PR events. A failed scan updates that same comment. Failure to comment never changes the scan result.
    required: false
    default: "true"
  comment-token:
    description: GitHub workflow token for the PR comment only. Never forwarded to DeployDoctor. Normally leave this at github.token.
    required: false
    default: ${{ github.token }}
  audit-link:
    description: Accepted for older workflows. The pull request comment does not include a paid audit offer.
    required: false
    default: "false"
  api-url:
    description: DeployDoctor base URL. Only change this for a self-hosted instance.
    required: false
    default: https://deploydoctor.nyttolabs.com
outputs:
  overall:
    description: red, yellow or green.
    value: ${{ steps.scan.outputs.overall }}
  report-url:
    description: Link to the saved report.
    value: ${{ steps.scan.outputs.report-url }}
  red:
    description: Number of failed checks.
    value: ${{ steps.scan.outputs.red }}
  yellow:
    description: Number of checks that need review.
    value: ${{ steps.scan.outputs.yellow }}
  comment-status:
    description: created, updated, skipped, stale or failed.
    value: ${{ steps.scan.outputs.comment-status }}
  comment-url:
    description: Link to the PR conversation comment when available.
    value: ${{ steps.scan.outputs.comment-url }}
runs:
  using: composite
  steps:
    - id: scan
      shell: bash
      env:
        DD_TOKEN: ${{ inputs.token }}
        DD_REPOSITORY: ${{ inputs.repository }}
        DD_REF: ${{ inputs.ref }}
        DD_GITHUB_TOKEN: ${{ inputs.github-token }}
        DD_FAIL_ON: ${{ inputs.fail-on }}
        DD_FAIL_ON_HIGH_RISK: ${{ inputs.fail-on-high-risk }}
        DD_CHECKS: ${{ inputs.checks }}
        DD_COMMENT: ${{ inputs.comment }}
        DD_COMMENT_TOKEN: ${{ inputs.comment-token }}
        DD_AUDIT_LINK: ${{ inputs.audit-link }}
        DD_API_URL: ${{ inputs.api-url }}
      run: node "${{ github.action_path }}/scan.mjs"
